# ==============================================================================
# configs/data.yaml
# Cau hinh toan bo pipeline lien quan den du lieu: dataset (Phase 3), EDA
# (Phase 4), va preprocessing/split/augmentation/dataloader (Phase 5).
# Tuyet doi khong hard-code cac gia tri nay trong source code (SDS Section 8).
# ==============================================================================

dataset:
  kaggle_handle: "abdallahalidev/plantvillage-dataset"
  dataset_subfolder: "color"
  allowed_extensions: [".jpg", ".jpeg", ".png"]
  min_file_size_bytes: 100
  duplicate_hash_algorithm: "md5"
  class_separator: "___"
  healthy_keyword: "healthy"

metadata:
  output_filename: "metadata.csv"
  clean_output_filename: "metadata_clean.csv"
  # Xac nhan tu docs/data_dictionary/metadata_schema.md: cot chua duong dan
  # TUONG DOI TU PROJECT ROOT (da bao gom ca "data/raw/.../color/...").
  filepath_column: "filepath"

validation:
  report_filename: "data_validation_report.md"
  sample_corrupt_log_limit: 20

eda:
  report_filename: "eda_report.md"
  class_distribution_filename: "class-distribution.csv"
  plant_type_distribution_filename: "plant-type-distribution.csv"
  image_dimension_stats_filename: "image-dimension-stats.csv"
  missing_analysis_filename: "missing-analysis.csv"
  imbalance_warning_threshold: 10.0

# ---- Phase 5: Data Preprocessing ----

preprocessing:
  image_size: 224
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42
  stratify_column: "class_name"
  # Canh bao neu so mau val/test cua 1 class thap hon nguong nay
  min_samples_per_class_warning: 30
  train_metadata_filename: "metadata_train.csv"
  val_metadata_filename: "metadata_val.csv"
  test_metadata_filename: "metadata_test.csv"
  class_mapping_filename: "class_to_idx.json"
  split_report_filename: "split_report.md"

augmentation:
  horizontal_flip_prob: 0.5
  rotation_degrees: 15
  color_jitter_brightness: 0.2
  color_jitter_contrast: 0.2
  color_jitter_saturation: 0.2
  # Bat WeightedRandomSampler cho train loader de giam bias ve class dong anh
  use_weighted_sampler: true

dataloader:
  # Luu y: MX550 2GB VRAM -> giu batch_size nho, se tinh chinh lai o Phase 6
  batch_size: 16
  num_workers: 2
  pin_memory: true
  shuffle_train: true