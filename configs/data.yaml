dataset:
  kaggle_handle: "abdallahalidev/plantvillage-dataset"
  dataset_subfolder: "color"
  allowed_extensions: [".jpg", ".jpeg", ".png"]
  min_file_size_bytes: 100
  duplicate_hash_algorithm: "md5"
  class_separator: "___"
  healthy_keyword: "healthy"

metadata:
  output_filename: "metadata.csv"
  clean_output_filename: "metadata_clean.csv"

validation:
  report_filename: "data_validation_report.md"
  sample_corrupt_log_limit: 20

# ---- Phase 4: Exploratory Data Analysis ----
eda:
  report_filename: "eda_report.md"
  class_distribution_filename: "class-distribution.csv"
  plant_type_distribution_filename: "plant-type-distribution.csv"
  image_dimension_stats_filename: "image-dimension-stats.csv"
  missing_analysis_filename: "missing-analysis.csv"
  # Ngưỡng tỷ lệ (max_count / min_count) để đánh dấu dataset là mất cân bằng
  # trong eda_report.md. Phase 3 đã phát hiện ~36x nên để 10.0 là ngưỡng an toàn.
  imbalance_warning_threshold: 10.0