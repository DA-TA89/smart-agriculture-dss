[alembic]
script_location = alembic
prepend_sys_path = .

; sqlalchemy.url is set DYNAMICALLY in alembic/env.py from the .env file
; (via src.database.session._build_database_url()) - not hard-coded here,
; per SDS Section 8 (secrets never live in a config file committed to Git).
;
; NOTE: this .ini file is parsed by Python's configparser using the OS
; locale encoding (not UTF-8) on some Windows setups, which raises
; UnicodeDecodeError on non-ASCII characters. Keep this file ASCII-only.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S